# Weekly dependency updates as pull requests (CI must pass before merging).
version: 2
updates:
  # The project is managed by Bun (bun.lock); the npm ecosystem cannot update it.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
